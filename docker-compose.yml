name: distributed-boiler-monitoring

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -W 3 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  sensors:
    build: ./sensors-sim
    env_file: .env
    depends_on:
      mosquitto:
        condition: service_healthy
    # sem container_name e sem porta publicada, para permitir --scale
    restart: unless-stopped

  cat:
    build: ./cat-service
    env_file: .env
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  alarms:
    build: ./alarms-service
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
